name: App build and tests

on:
  push:
    branches: [main]
    paths-ignore: ["pipeline/**", "site/**", "**.md"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testFdroidDebugUnitTest testGithubDebugUnitTest
      - name: Build debug APKs
        run: ./gradlew assembleFdroidDebug assembleGithubDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
